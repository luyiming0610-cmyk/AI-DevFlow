
name: AI DevFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AI_MODE: mock

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q main.py agents core review.py

      - name: Run complete pipeline
        run: python main.py

      - name: Run regression tests
        run: python -m pytest tests -v

      - name: Verify quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports")

          gate = json.loads(
              (root / "quality_gate.json").read_text(
                  encoding="utf-8"
              )
          )

          review = json.loads(
              (root / "review_request.json").read_text(
                  encoding="utf-8"
              )
          )

          before = (
              root / "before_repair_pytest.txt"
          ).read_text(encoding="utf-8")

          after = (
              root / "after_repair_pytest.txt"
          ).read_text(encoding="utf-8")

          assert gate["passed"] is True
          assert all(gate["checks"].values())
          assert review["status"] == "PENDING"
          assert review["sha256"] == gate["sha256"]
          assert "FAILED" in before
          assert "3 passed" in after

          print("Pipeline evidence verified.")
          print("Quality gates: PASS")
          print("Human review: PENDING")
          PY

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-devflow-evidence
          path: reports/
          if-no-files-found: warn
