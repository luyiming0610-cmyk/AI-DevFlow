
name: AI DevFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-tests:
    name: Python engineering tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AI_MODE: mock

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall -q agents core tests experiments
          python -m py_compile main.py dashboard.py review.py

      - name: Run legacy MOCK pipeline
        run: python main.py

      - name: Run engineering tests
        run: python -m pytest tests -v

      - name: Verify MOCK quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("reports")

          gate = json.loads(
              (root / "quality_gate.json").read_text(encoding="utf-8")
          )
          review = json.loads(
              (root / "review_request.json").read_text(encoding="utf-8")
          )

          before = (root / "before_repair_pytest.txt").read_text(
              encoding="utf-8"
          )
          after = (root / "after_repair_pytest.txt").read_text(
              encoding="utf-8"
          )

          assert gate["passed"] is True
          assert all(gate["checks"].values())
          assert review["status"] == "PENDING"
          assert review["sha256"] == gate["sha256"]
          assert "FAILED" in before
          assert "3 passed" in after

          print("MOCK quality gate verified.")
          PY

      - name: Upload MOCK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-pipeline-evidence
          path: reports/
          if-no-files-found: warn

  docker-acceptance:
    name: Docker acceptance and red-green replay
    needs: engineering-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AI_MODE: mock

    steps:
      - name: Checkout source and evidence
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Docker availability
        run: docker version

      - name: Build isolated test image
        run: docker build -t aidevflow-test:1 ./docker/runner

      - name: Verify original candidate green
        run: |
          python -m core.isolated_tester \
            --candidate evidence/real_api/20261121-085152-bc4b86/round_02/candidate.py \
            --output ci_evidence/baseline

      - name: Verify deliberately seeded red test
        shell: bash
        run: |
          if python -m core.isolated_tester \
            --candidate evidence/red_green/20261121-091420-597571/faulty_seed.py \
            --output ci_evidence/red; then
            echo "ERROR: The deliberately faulty code unexpectedly passed."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("ci_evidence/red/validation.json").read_text(
                  encoding="utf-8"
              )
          )

          assert report["status"] == "FAILED", report
          assert report["tests_executed"] is True, report
          assert report["failed_count"] >= 1, report

          print("Expected real Pytest failure confirmed.")
          PY

      - name: Verify DeepSeek repair green
        run: |
          python -m core.isolated_tester \
            --candidate evidence/red_green/20261121-091420-597571/repair_01.py \
            --output ci_evidence/repaired

      - name: Verify both green reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for stage in ("baseline", "repaired"):
              path = Path("ci_evidence") / stage / "validation.json"
              report = json.loads(path.read_text(encoding="utf-8"))

              assert report["status"] == "PASSED", report
              assert report["tests_executed"] is True, report
              assert report["passed_count"] == 15, report
              assert report["failed_count"] == 0, report

              print(f"{stage}: 15/15 passed.")

          print("Docker red-green replay verified.")
          PY

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-acceptance-evidence
          path: ci_evidence/
          if-no-files-found: warn
